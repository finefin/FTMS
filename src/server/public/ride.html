<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FTMS Ride</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }

    /* HUD overlay (DOM, above the WebGL canvas) */
    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #fff;
      font-family: "Segoe UI", system-ui, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    }
    #hud.visible { opacity: 1; }
    #hud .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    #hud .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9be8ff;
      min-width: 74px;
    }
    #hud .value { font-size: 28px; font-weight: 700; color: #fff; }
    #hud .unit { font-size: 13px; color: #9be8ff; }
    #hud .equipment { font-size: 14px; color: #ff8ade; margin-top: 8px; }

    /* Full-screen connection overlay */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 4, 14, 0.55);
      color: #ffe9ff;
      font-size: 20px;
      letter-spacing: 0.05em;
      text-shadow: 0 0 12px rgba(255, 43, 214, 0.6);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #overlay.hidden { opacity: 0; }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: rgba(255, 220, 255, 0.6);
      font-size: 13px;
      letter-spacing: 0.04em;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row"><span class="label">Speed</span><span class="value" id="hud-speed">0.0</span><span class="unit">km/h</span></div>
    <div class="row"><span class="label">Heart</span><span class="value" id="hud-hr">—</span><span class="unit">bpm</span></div>
    <div class="row"><span class="label">Power</span><span class="value" id="hud-intensity">0%</span></div>
    <div class="equipment" id="hud-equipment">—</div>
  </div>

  <div id="overlay">Connecting to fitness device…</div>
  <div class="hint">Drag to look around · scroll to ride faster</div>

  <a-scene renderer="antialias:false" fog="type: linear; color: #000; near: 8; far: 160">
    <a-sky color="#0b0620"></a-sky>

    <a-entity id="landscape" ride-landscape="speed: 12"></a-entity>

    <a-entity id="rig">
      <a-camera id="cam" position="0 2.2 0" look-controls="enabled: true"></a-camera>

      <a-entity id="hud" ride-hud></a-entity>
    </a-entity>
  </a-scene>

  <script src="ride-landscape.js"></script>
  <script src="ride-hud.js"></script>
  <script src="ride.js"></script>
</body>
</html>
